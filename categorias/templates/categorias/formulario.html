<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'categorias/css/estilos.css' %}">
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <img src="{% static 'categorias/img/logo-categorias.png' %}" alt="Categorías">
            <h1>{{ titulo }}</h1>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-grupo">
                <label for="id_nombre">Nombre</label>
                {{ formulario.nombre }}
            </div>
            <button type="submit" class="btn btn-crear">Guardar</button>
            <a href="{% url 'categorias:lista' %}" class="btn btn-editar">Cancelar</a>
        </form>
    </div>
</body>
</html>
